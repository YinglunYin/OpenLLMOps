name: CI

on:
  push:
  pull_request:

# CI 只需要读取源码；显式收紧默认令牌权限，避免依赖步骤获得写仓库能力。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: FastAPI 后端
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      # 固定到官方 Action 的完整提交，避免同名标签被移动后静默改变 CI 代码。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装锁定依赖
        run: uv sync --locked --all-groups
      - name: 静态检查
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 单元与集成测试
        run: uv run pytest -q

  node-agent:
    name: GPU 节点代理
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/pyproject.toml
            workers/training_config/pyproject.toml
            workers/training_runtime/pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./workers/training_config \
            -e ./workers/training_runtime \
            -e './agent[test]' \
            'ruff==0.16.4'
      - name: 静态检查
        run: |
          ruff check agent
          ruff format --check agent
      - name: 单元测试
        run: pytest -q agent/tests

  python-components:
    name: 模型导入、训练配置、产物与测评
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            evaluation/pyproject.toml
            workers/*/pyproject.toml
      - name: 安装依赖
        run: |
          python -m pip install --disable-pip-version-check \
            -e './evaluation[dev]' \
            -e './workers/model_importer[dev]' \
            -e './workers/training_config[dev]' \
            -e './workers/training_runtime[dev]' \
            -e './workers/artifacts[dev]'
      - name: 静态检查
        run: |
          ruff check evaluation workers scripts deploy/scripts/*.py
          ruff format --check evaluation workers scripts deploy/scripts/*.py
      - name: 单元测试
        run: |
          pytest -q evaluation/tests
          pytest -q workers/model_importer/tests
          pytest -q workers/training_config/tests
          pytest -q workers/training_runtime/tests
          pytest -q workers/artifacts/tests

  frontend:
    name: Vue 前端
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 类型检查与单元测试
        run: |
          npm run typecheck
          npm run test:unit
      - name: 生产构建
        run: npm run build
