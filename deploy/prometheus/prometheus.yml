global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    system: openllmops
    node: single-host

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: openllmops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: openllmops-node-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["node-agent:9000"]

  - job_name: nvidia-dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
