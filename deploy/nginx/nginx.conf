user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    # 普通管理/OpenAI JSON 请求保持小上限，避免未认证端点被超大 body 打爆内存。
    client_max_body_size 16m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    upstream openllmops_api {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 8080;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /_gateway/health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # 仅数据集上传允许 5 GiB（另留 1 MiB multipart 开销）；精确 location
        # 优先于下方正则，其他登录/管理接口仍受 16 MiB 全局限制。
        location = /api/v1/datasets/upload {
            client_max_body_size 5121m;
            proxy_pass http://openllmops_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API、OpenAI 兼容端点和流式 Playground 统一经 FastAPI 鉴权/路由。
        location ~ ^/(api|v1)(/|$) {
            proxy_pass http://openllmops_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /openapi.json {
            proxy_pass http://openllmops_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /docs {
            proxy_pass http://openllmops_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
