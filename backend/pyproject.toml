[project]
name = "openllmops-backend"
version = "0.1.0"
description = "OpenLLMOps 单机多卡大模型管理平台后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openllmops-model-importer[huggingface,modelscope]",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
openllmops-model-importer = { path = "../workers/model_importer" }

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  # Starlette 1.x 正在把 TestClient 从 httpx 迁移到 httpx2；不影响生产 ASGI 路径。
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  # Python 3.14 已弃用事件循环 policy；警告来自 pytest-asyncio 依赖内部，不是业务代码。
  "ignore:.*event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin",
  "ignore:.*event_loop_policy.*:DeprecationWarning:pytest_asyncio.*",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
# FastAPI 官方依赖注入就是以 Depends/File/Form 调用作为默认值，B008 对此会误报。
ignore = [
  "B008",
  # 中文文案和有效中文注释需要使用全角标点，并非 Unicode 混淆字符。
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"app/schemas/__init__.py" = ["F401"]
"migrations/versions/*.py" = ["E501"]
"tests/conftest.py" = ["E402"]
