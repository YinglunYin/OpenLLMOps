[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openllmops-evaluation"
version = "0.1.0"
description = "OpenLLMOps 可复现的中文模型评测执行器"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
openllmops-eval = "openllmops_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openllmops_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

