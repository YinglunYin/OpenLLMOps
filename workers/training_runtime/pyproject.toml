[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openllmops-training-runtime"
version = "0.1.0"
description = "OpenLLMOps 安全 LLaMA-Factory 训练与合并入口"
requires-python = ">=3.11"
dependencies = [
  "openllmops-training-config==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
openllmops-training-runtime = "openllmops_training_runtime.cli:main"

[tool.uv.sources]
openllmops-training-config = { path = "../training_config" }

[tool.hatch.build.targets.wheel]
packages = ["src/openllmops_training_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]
