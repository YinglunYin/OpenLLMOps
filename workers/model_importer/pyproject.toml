[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openllmops-model-importer"
version = "0.1.0"
description = "OpenLLMOps 安全模型下载、校验与原子入库执行器"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
huggingface = ["huggingface-hub>=0.28,<1"]
modelscope = ["modelscope>=1.22,<2"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openllmops_model_importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

